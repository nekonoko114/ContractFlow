name: Deploy to Lolipop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Sync Files and Run Remote Commands
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # 1. SSH 鍵のセットアップ
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 2. 変数のサニタイズ（空白・改行の除去）
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          USER=$(echo "$SSH_USERNAME" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-2222}" | tr -d '[:space:]')
          TARGET=$(echo "$DEPLOY_PATH" | tr -d '[:space:]')

          echo "Target Host: $USER@$HOST:$PORT"
          echo "Target Path: $TARGET"

          # 3. known_hosts に追加
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # 4. Rsync によるファイル転送
          echo "Starting rsync..."
          rsync -avz --delete \
            -e "ssh -p $PORT -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            --exclude="/.git/" \
            --exclude="/.github/" \
            --exclude="/node_modules/" \
            --exclude="/tests/" \
            --exclude="/storage/logs/*" \
            --exclude="/storage/framework/cache/data/*" \
            --exclude="/storage/framework/sessions/*" \
            --exclude="/storage/framework/views/*" \
            --exclude="/.env" \
            ./ "$USER@$HOST:$TARGET/"

          echo "Rsync transfer completed successfully."

          # 5. ロリポップ上での Artisan コマンド実行
          echo "Executing post-deployment tasks on Lolipop..."
          ssh -p "$PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" bash -c "'
            cd \"$TARGET\" 2>/dev/null || cd ~/web/contractflow
            
            # PHP バイナリの検出
            if [ -f /usr/local/php/8.4/bin/php ]; then
              PHP_BIN=\"/usr/local/php/8.4/bin/php\"
            elif [ -f /usr/local/php/8.3/bin/php ]; then
              PHP_BIN=\"/usr/local/php/8.3/bin/php\"
            else
              PHP_BIN=\"php\"
            fi
            
            echo \"PHP Binary: \$(\$PHP_BIN -v | head -n 1)\"
            
            # ディレクトリ権限設定
            chmod -R 777 storage bootstrap/cache 2>/dev/null || true
            
            # シンボリックリンクとマイグレーション
            \$PHP_BIN -d memory_limit=512M artisan storage:link 2>/dev/null || true
            \$PHP_BIN -d memory_limit=512M artisan migrate --force 2>/dev/null || true
            
            # 最適化キャッシュ
            \$PHP_BIN -d memory_limit=512M artisan optimize:clear 2>/dev/null || true
            \$PHP_BIN -d memory_limit=512M artisan config:cache 2>/dev/null || true
            \$PHP_BIN -d memory_limit=512M artisan route:cache 2>/dev/null || true
            \$PHP_BIN -d memory_limit=512M artisan view:cache 2>/dev/null || true
            
            echo \"All deployment tasks completed.\"
          '"
