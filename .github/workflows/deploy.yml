name: Deploy to Lolipop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Deploy via Rsync over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # 秘密鍵の配置とパーミッション設定
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Secrets の余分な空白や改行を自動サニタイズ
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          USER=$(echo "$SSH_USERNAME" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-2222}" | tr -d '[:space:]')
          TARGET=$(echo "$DEPLOY_PATH" | tr -d '[:space:]')

          echo "Connecting to $USER@$HOST:$PORT..."

          # known_hosts に追加
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Rsync でファイル転送（不要なファイルを除外して安全に同期）
          rsync -avz --delete \
            -e "ssh -p $PORT -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            --exclude="/.git/" \
            --exclude="/.github/" \
            --exclude="/node_modules/" \
            --exclude="/tests/" \
            --exclude="/storage/logs/*" \
            --exclude="/storage/framework/cache/data/*" \
            --exclude="/storage/framework/sessions/*" \
            --exclude="/storage/framework/views/*" \
            --exclude="/.env" \
            ./ "$USER@$HOST:$TARGET/"

      - name: Run Post-Deployment Commands on Lolipop
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          USER=$(echo "$SSH_USERNAME" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-2222}" | tr -d '[:space:]')
          TARGET=$(echo "$DEPLOY_PATH" | tr -d '[:space:]')

          ssh -p "$PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" << 'EOF'
            cd "$TARGET" 2>/dev/null || cd ~/web/contractflow
            
            # PHP バイナリの自動検出
            if [ -f /usr/local/php/8.4/bin/php ]; then
              PHP_BIN="/usr/local/php/8.4/bin/php"
            elif [ -f /usr/local/php/8.3/bin/php ]; then
              PHP_BIN="/usr/local/php/8.3/bin/php"
            else
              PHP_BIN="php"
            fi
            
            echo "Using PHP binary: $($PHP_BIN -v | head -n 1)"
            
            # パーミッション設定
            chmod -R 777 storage bootstrap/cache
            
            # ストレージシンボリックリンク作成
            $PHP_BIN -d memory_limit=512M artisan storage:link || true
            
            # データベースマイグレーション
            $PHP_BIN -d memory_limit=512M artisan migrate --force
            
            # 本番用キャッシュ作成
            $PHP_BIN -d memory_limit=512M artisan optimize:clear
            $PHP_BIN -d memory_limit=512M artisan config:cache
            $PHP_BIN -d memory_limit=512M artisan route:cache
            $PHP_BIN -d memory_limit=512M artisan view:cache
            
            echo "Deployment successfully finished."
          EOF
