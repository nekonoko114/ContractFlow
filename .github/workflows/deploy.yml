name: Deploy to Lolipop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Files for Deployment
        run: |
          # デプロイに不要なテストファイルや開発用キャッシュを削除
          rm -rf tests
          rm -rf node_modules
          rm -rf .github

      - name: Deploy to Lolipop via SSH / rsync
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || '2222' }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          EXCLUDE: "/.git/, /.github/, /node_modules/, /storage/logs/*, /storage/framework/cache/data/*, /storage/framework/sessions/*, /storage/framework/views/*, /.env"
          ARGS: "-rlgoDzvc -i --delete"

      - name: Run Post-Deployment Commands on Lolipop
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 2222 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            # パーミッション設定
            chmod -R 777 storage bootstrap/cache
            
            # ストレージシンボリックリンク作成
            php -d memory_limit=512M artisan storage:link || true
            
            # データベースマイグレーション
            php -d memory_limit=512M artisan migrate --force
            
            # 本番用キャッシュ作成
            php -d memory_limit=512M artisan optimize:clear
            php -d memory_limit=512M artisan config:cache
            php -d memory_limit=512M artisan route:cache
            php -d memory_limit=512M artisan view:cache
